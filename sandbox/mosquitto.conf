# Mosquitto 2.0 binds 127.0.0.1 and denies anonymous clients by default. Without
# these two lines the broker starts cleanly and then refuses every connection,
# which is a genuinely confusing failure. Same fix as server/setup/02_mosquitto.sh.
listener 1883 0.0.0.0
allow_anonymous true

persistence true
persistence_location /mosquitto/data/
max_queued_messages 10000

log_dest stdout
log_type notice
