; M5StickC PLUS (SKU K016-P) — ESP32-PICO-D4, 4 MB flash, MPU6886 IMU, AXP192 PMU
;
; Build without hardware attached:   pio run
; Flash once the board is connected: pio run -t upload && pio device monitor
;
; Versions are pinned so a rebuild months from now produces the same binary --
; the same reasoning as the pinned server packages in docs/ARCHITECTURE.md §4.

[env:m5stick-c-plus]
platform = espressif32@6.5.0
board = m5stick-c
framework = arduino
monitor_speed = 115200
upload_speed = 1500000

build_flags =
    -DCORE_DEBUG_LEVEL=1

lib_deps =
    ; M5Unified supersedes the per-device M5StickC-Plus library, which upstream
    ; has deprecated. It probes the board at runtime, so the same source builds
    ; for StickC, StickC PLUS and PLUS2.
    m5stack/M5Unified@^0.1.16

    ; NOT PubSubClient: it can only publish at QoS 0, and the design calls for
    ; QoS 1 so the broker redelivers across WiFi drops (ARCHITECTURE.md §5.2),
    ; with QoS 0 vs 1 as factor D of the benchmark. This library does QoS 1 and
    ; takes its buffer size in the constructor.
    256dpi/MQTT@^2.5.2
